# Isolated Node.js environment for this website (does not use or modify container_qc).
# Start the dev server:  docker compose up -d      -> http://localhost:4321
# Run a one-off command: docker compose run --rm web npm run check
name: project_1_academic_website
services:
  web:
    image: node:24-bookworm-slim
    container_name: academic_website_dev
    user: node                      # uid 1000, same as the WSL user -> files stay owned by you
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:4321:4321"       # only reachable from this computer
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    init: true
    command: ["sh", "-c", "[ -d node_modules ] || npm ci; exec npm run dev"]
